<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotorama — Privacy Policy</title>
<meta http-equiv="refresh" content="0; url=https://spotorama.app/privacy.html">
<link rel="canonical" href="https://spotorama.app/privacy.html">
<style>
  :root {
    --bg: #faf0d7; --panel: #fffaf0; --ink: #2e2417; --muted: #6b5b45;
    --rule: #e3d4b4; --accent: #e2521d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f; --panel: #1b212b; --ink: #e8e4dc; --muted: #a39b8d;
      --rule: #2b3341; --accent: #ff7a45;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 32rem; padding: 32px; border: 1px solid var(--rule); border-radius: 14px;
    background: var(--panel); text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 1.4rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  a.go {
    display: inline-block; padding: 12px 20px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  a.go:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div class="card">
  <h1>Spotorama’s privacy policy has moved</h1>
  <p>The policy now lives at spotorama.app. You should be taken there automatically.</p>
  <p><a class="go" href="https://spotorama.app/privacy.html">Go to spotorama.app</a></p>
</div>
</body>
</html>
